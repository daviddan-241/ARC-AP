<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<title>ARC</title>
<style>
:root{--bg:#f2f2f7;--panel:#ffffff;--panel2:#f2f2f7;--line:rgba(60,60,67,.13);--line2:rgba(60,60,67,.22);--text:#1c1c1e;--dim:#8e8e93;--accent:#6c8cff;--accent2:#8f6cff;--iosblue:#007aff;--ok:#34c759;--warn:#ff9500;--err:#ff3b30;--sb:env(safe-area-inset-bottom);--shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.045)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif}
#app{display:flex;height:100dvh}
/* ---- sidebar ---- */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:300px;max-width:80vw;background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:.24s;z-index:12;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#sidebar.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.08)}
#sb-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px}
#sb-head b{font-size:22px;font-weight:700;letter-spacing:-.4px}
.sb-btn{background:var(--text);border:none;color:#fff;border-radius:13px;padding:11px 14px;font-size:14.5px;font-weight:600;cursor:pointer;margin:0 14px 12px}
.sb-section{padding:10px 16px 6px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
#recents{flex:1;overflow-y:auto;padding:0 10px}
.rec{padding:11px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec:active,.rec.sel{background:var(--panel2)}
.rec small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#sb-foot{padding:8px 16px calc(16px + var(--sb));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.foot-btn{background:none;border:none;color:var(--iosblue);font-size:15px;font-weight:500;text-align:left;cursor:pointer;padding:10px 2px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:11;display:none}
#scrim.on{display:block}
/* ---- main / header ---- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(242,242,247,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative;z-index:2}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;color:#fff;box-shadow:var(--shadow)}
header b{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(52,199,89,.6)}
.dot.off{background:var(--err);box-shadow:0 0 6px rgba(255,59,48,.6)}
.icon-btn{background:none;border:none;color:var(--iosblue);font-size:20px;cursor:pointer;padding:6px 8px}
/* ---- feed / messages ---- */
#feed{flex:1;overflow-y:auto;padding:16px 14px calc(16px + var(--sb));-webkit-overflow-scrolling:touch}
.msg{max-width:82%;margin:0 0 10px;padding:12px 15px;border-radius:19px;line-height:1.48;white-space:pre-wrap;word-wrap:break-word;font-size:16px;animation:up .24s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.user{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));border-bottom-right-radius:6px;color:#fff;box-shadow:var(--shadow)}
.arc{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
/* activity chips */
.acts{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--text);box-shadow:var(--shadow)}
.chip.on{border-color:var(--accent)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:p 1.1s infinite;font-style:normal}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
/* question card */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px;margin:0 0 10px;max-width:82%;box-shadow:var(--shadow)}
.qcard .qt{font-size:15.5px;margin-bottom:11px}
.qopt{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--iosblue);border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px;font-weight:500;cursor:pointer;text-align:left}
.qopt:active{background:rgba(0,122,255,.08)}
/* task card */
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:14px 15px;margin:0 0 10px;max-width:82%;font-size:14px;box-shadow:var(--shadow)}
.tcard b{font-size:14.5px}
.tstep{color:var(--dim);margin-top:7px;line-height:1.55;max-height:150px;overflow-y:auto}
.tstop{background:none;border:none;color:var(--err);font-size:13px;font-weight:600;margin-top:9px;cursor:pointer;padding:0}
/* browser card */
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:19px;margin:0 0 10px;max-width:82%;overflow:hidden;box-shadow:var(--shadow)}
.bcard img{width:100%;display:block}
.bcard .bbar{display:flex;align-items:center;gap:8px;padding:10px 13px;font-size:12.5px;color:var(--dim)}
/* composer */
#composer{padding:9px 12px calc(10px + var(--sb));border-top:1px solid var(--line);background:rgba(242,242,247,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#row{display:flex;gap:9px;align-items:flex-end}
#input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:20px;color:var(--text);font-size:16px;padding:11px 15px;resize:none;max-height:110px;font-family:inherit;outline:none;box-shadow:var(--shadow)}
#input:focus{border-color:var(--accent)}
#input::placeholder{color:#c0c0c8}
#send{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow)}
#send:disabled{opacity:.35}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:14;display:none}
.sheet.on{display:block}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;padding:12px 18px calc(26px + var(--sb));max-height:82dvh;overflow-y:auto;animation:up .22s ease;box-shadow:0 -8px 40px rgba(0,0,0,.12)}
.grab{width:38px;height:5px;background:#d1d1d6;border-radius:3px;margin:4px auto 14px}
h3{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin:16px 0 10px}
.f{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:16px;padding:12px 13px;margin-bottom:10px;outline:none;font-family:inherit}
.f:focus{border-color:var(--accent)}
.save{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;border-radius:14px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.cap{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:8px}
.st{font-size:11px;font-weight:700;letter-spacing:.7px;padding:3px 9px;border-radius:99px}
.READY{color:#1e9e4b;background:rgba(52,199,89,.13)}.DEGRADED{color:#c77700;background:rgba(255,149,0,.13)}.NOT_CONFIGURED,.OFFLINE,.ERROR{color:#d70015;background:rgba(255,59,48,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:rgba(28,28,30,.94);color:#fff;padding:9px 17px;border-radius:99px;font-size:13.5px;z-index:20;opacity:0;transition:.22s;box-shadow:var(--shadow)}
.toast.show{opacity:1}
pre{background:#f6f6f8;border:1px solid var(--line);border-radius:12px;padding:11px;overflow-x:auto;font-size:13px;margin:8px 0;color:#1c1c1e}
@media(min-width:800px){#feed{max-width:740px;margin:0 auto}#composer{max-width:740px;margin:0 auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sb-head"><b>ARC</b><button class="icon-btn" id="sb-close">✕</button></div>
    <button class="sb-btn" id="newchat">＋ New chat</button>
    <div class="sb-section">Recent</div>
    <div id="recents"></div>
    <div id="sb-foot">
      <button class="foot-btn" id="open-browser">🌐 Browser</button>
      <button class="foot-btn" id="open-settings">⚙ Settings</button>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="main">
    <header>
      <button class="icon-btn" id="sb-open">☰</button>
      <div class="logo">ARC</div><b>ARC</b><span class="dot" id="dot"></span>
      <button class="icon-btn" id="sys">⌘</button>
    </header>
    <div id="feed"></div>
    <div id="composer"><div id="row">
      <textarea id="input" rows="1" placeholder="Message ARC…"></textarea>
      <button id="send">▲</button>
    </div></div>
  </div>
</div>
<div class="sheet" id="settings"><div class="panel">
  <div class="grab"></div><h3>Model endpoint</h3>
  <input class="f" id="s-base" placeholder="Ollama URL (e.g. http://127.0.0.1:11434 or https://ollama.com)">
  <input class="f" id="s-key" type="password" placeholder="API key (write-only, never shown again)">
  <h3>Models (optional)</h3>
  <input class="f" id="s-p" placeholder="Primary (e.g. a Qwen model)">
  <input class="f" id="s-r" placeholder="Reasoning (e.g. a DeepSeek model)">
  <input class="f" id="s-c" placeholder="Critic (e.g. a Dolphin model)">
  <h3>ARC access</h3>
  <input class="f" id="s-api" placeholder="ARC API key (from your deploy)">
  <h3>Background tasks</h3>
  <input class="f" id="s-steps" type="number" placeholder="Max steps per task (default 50)">
  <button class="save" id="save-settings">Save</button>
  <h3>Capability matrix</h3><div id="caps">Checking…</div>
</div></div>
<div class="sheet" id="browser"><div class="panel">
  <div class="grab"></div><h3>ARC Browser</h3>
  <input class="f" id="b-url" placeholder="https://…">
  <div style="display:flex;gap:8px">
    <button class="save" id="b-shot" style="flex:1">Show me</button>
    <button class="save" id="b-read" style="flex:1;background:var(--panel2);border:1px solid var(--line)">Read</button>
  </div>
  <div id="b-out" style="margin-top:12px"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),feed=$('#feed'),input=$('#input'),send=$('#send');
const DEFAULT_KEY='arc-6c09153459e12754bf9a9266bd1553a2';
const hdrs=()=>{const k=localStorage.arc_key||DEFAULT_KEY;return {'Authorization':'Bearer '+k}};
async function AF(u,o={}){const r=await fetch(u,{...o,headers:{...(o.headers||{}),...hdrs()}});
  if(r.status===401){toast('API key required');$('#settings').classList.add('on');loadSettings()}
  return r}
const API=location.origin;let session='s'+Date.now(),busy=false;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>{let t=esc(s);t=t.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>'<pre>'+c+'</pre>');t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');t=t.replace(/\[(\d+)\]/g,'<span style="color:#6c8cff">[$1]</span>');return t};
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!busy){e.preventDefault();go()}});
send.addEventListener('click',()=>!busy&&go());
/* sidebar */
$('#sb-open').onclick=()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('on');loadRecents()};
const closeSb=()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('on')};
$('#sb-close').onclick=closeSb;$('#scrim').onclick=closeSb;
$('#newchat').onclick=()=>{session='s'+Date.now();feed.innerHTML='';closeSb();toast('New chat')};
async function loadRecents(){
  const r=await(await AF(API+'/sessions')).json();
  $('#recents').innerHTML=(r.sessions||[]).map(s=>`<div class="rec" data-s="${esc(s.session)}">${esc(s.preview||s.session)}<small>${s.messages} msg</small></div>`).join('')||'<div class="rec" style="color:#8e8e93">No chats yet</div>';
  $('#recents').querySelectorAll('.rec[data-s]').forEach(el=>el.onclick=async()=>{session=el.dataset.s;await openSession();closeSb()});
}
async function openSession(){
  feed.innerHTML='';const r=await(await AF(API+'/sessions/'+session)).json();
  for(const m of r.messages||[]){bubble(m.role,m.content)}
}
/* sheets */
const sheet=(id,open)=>{ $(id).classList.toggle('on',open) };
$('#open-settings').onclick=async()=>{closeSb();sheet('#settings',true);loadSettings();loadCaps()};
$('#sys').onclick=async()=>{sheet('#settings',true);loadCaps()};
$('#settings').addEventListener('click',e=>{if(e.target.id==='settings')sheet('#settings',false)});
$('#open-browser').onclick=()=>{closeSb();sheet('#browser',true)};
$('#browser').addEventListener('click',e=>{if(e.target.id==='browser')sheet('#browser',false)});
async function loadSettings(){
  const r=await(await AF(API+'/settings')).json();const s=r.settings||{};
  $('#s-base').value=s.ollama_base_url||r.defaults.ollama_base_url;
  $('#s-p').value=s.model_primary||'';$('#s-r').value=s.model_reasoning||'';$('#s-c').value=s.model_critic||'';
  $('#s-key').value='';$('#s-steps').value=s.max_task_steps||'';$('#s-api').value=localStorage.arc_key||'';
  $('#s-key').placeholder=r.has_api_key?'API key set (leave blank to keep)':'API key (optional)';
}
$('#save-settings').onclick=async()=>{
  const body={};
  const v=(id,k)=>{if($(id).value.trim())body[k]=$(id).value.trim()};
  v('#s-base','ollama_base_url');v('#s-p','model_primary');v('#s-r','model_reasoning');v('#s-c','model_critic');
  if($('#s-key').value.trim())body.ollama_api_key=$('#s-key').value.trim();
  if($('#s-steps').value.trim())body.max_task_steps=parseInt($('#s-steps').value);
  if($('#s-api').value.trim())localStorage.arc_key=$('#s-api').value.trim();
  await AF(API+'/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  toast('Saved');sheet('#settings',false);
};
async function loadCaps(){
  try{const c=await(await AF(API+'/capabilities')).json();
    $('#caps').innerHTML=Object.entries(c).map(([k,v])=>`<div class="cap"><span>${k.toUpperCase()}</span><span class="st ${v.state}">${v.state}</span></div>`).join('');
  }catch(e){$('#caps').innerHTML='<div class="cap"><span>Control plane unreachable</span><span class="st ERROR">ERROR</span></div>'}
}
/* browser */
$('#b-shot').onclick=async()=>{
  const url=$('#b-url').value.trim();if(!url)return;
  $('#b-out').innerHTML='<div style="color:#8e8e93">Loading…</div>';
  const r=await(await AF(API+'/browse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,action:'screenshot'})})).json();
  $('#b-out').innerHTML=r.screenshot?`<img src="${API+r.screenshot}" style="width:100%;border-radius:12px;border:1px solid rgba(60,60,67,.13)">`:`<div style="color:#ff3b30">${esc(r.error||'failed')}</div>`;
};
$('#b-read').onclick=async()=>{
  const url=$('#b-url').value.trim();if(!url)return;
  $('#b-out').innerHTML='<div style="color:#8e8e93">Reading…</div>';
  const r=await(await AF(API+'/browse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,action:'extract'})})).json();
  $('#b-out').innerHTML=`<div style="font-size:13px;line-height:1.5;max-height:260px;overflow-y:auto">${esc((r.text||r.error||'').slice(0,4000))}</div>`;
};
/* chat */
function bubble(role,text){
  const d=document.createElement('div');d.className='msg '+(role==='user'||role==='me'?'user':'arc');
  d.innerHTML=md(text);feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d;
}
let actBox=null;
function activity(ev){
  if(!actBox){actBox=document.createElement('div');actBox.className='acts';feed.appendChild(actBox)}
  actBox.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  const c=document.createElement('div');c.className='chip on';c.innerHTML=`<i></i>${esc(ev.label||ev.type)}`;
  c.onclick=()=>toast(ev.detail||'');
  actBox.appendChild(c);feed.scrollTop=feed.scrollHeight;
}
function qcard(text,opts){
  const d=document.createElement('div');d.className='qcard';
  d.innerHTML=`<div class="qt">${esc(text)}</div>`+opts.map((o,i)=>`<button class="qopt" data-i="${i}">${esc(o)}</button>`).join('');
  d.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{d.remove();input.value=opts[b.dataset.i];go()});
  feed.appendChild(d);feed.scrollTop=feed.scrollHeight;
}
function taskCard(t){
  const d=document.createElement('div');d.className='tcard';d.id='task-'+t.id;
  renderTask(d,t);feed.appendChild(d);feed.scrollTop=feed.scrollHeight;
  pollTask(t.id);
}
function renderTask(d,t){
  const steps=(t.steps||[]).slice(-6).map(s=>`• <b>${esc(s.kind)}</b> ${esc((s.detail||'').slice(0,80))}`).join('<br>');
  d.innerHTML=`<b>⏳ ${esc(t.goal.slice(0,90))}</b><div class="tstep">${steps||'starting…'}</div>
    <button class="tstop">■ Stop task</button>`;
  d.querySelector('.tstop').onclick=async()=>{await AF(API+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'stop',task_id:t.id})});toast('Task stopped')};
}
async function pollTask(id){
  const iv=setInterval(async()=>{
    const r=await(await AF(API+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'get',task_id:id})})).json();
    const d=document.getElementById('task-'+id);if(!d){clearInterval(iv);return}
    if(r.state&&r.state!=='running'){clearInterval(iv);renderTask(d,r);const s=document.createElement('div');s.className='msg arc';s.innerHTML=md('✅ Task finished: '+(r.result||r.state));feed.appendChild(s)}
    else renderTask(d,r);
    feed.scrollTop=feed.scrollHeight;
  },3000);
}
async function go(){
  const text=input.value.trim();if(!text)return;
  input.value='';input.style.height='auto';busy=true;send.disabled=true;
  bubble('user',text);actBox=null;
  /* background task intent */
  if(/\b(task|background)\b/i.test(text)&&/^(arc[,:\s]*)?(do|start|run|make|create|build|research)\b/i.test(text.replace(/\btask\b/i,'task'))&&/in background|as a task|background task/i.test(text)){
    const r=await(await AF(API+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal:text.replace(/.*background task:? ?/i,'')})})).json();
    taskCard(r);busy=false;send.disabled=false;return;
  }
  const d=bubble('arc','');
  try{
    const res=await AF(API+'/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session})});
    if(!res.ok){let j='';try{j=(await res.json()).detail}catch(e){}throw new Error(j||('HTTP '+res.status))}
    const rd=res.body.getReader(),dec=new TextDecoder();let buf='',ans='',started=false;
    while(true){const{done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
      for(const l of ls){if(!l.trim())continue;let ev;try{ev=JSON.parse(l)}catch(e){continue}
        if(ev.event==='activity'||ev.label)activity(ev);
        else if(ev.event==='token'){if(!started){started=true;d.innerHTML=''}ans+=ev.text;d.innerHTML=md(ans);feed.scrollTop=feed.scrollHeight}
        else if(ev.event==='question')qcard(ev.text,ev.options||[]);
        else if(ev.event==='task'){taskCard(ev.task)}
        else if(ev.event==='error')throw new Error(ev.detail);
      }}
    if(!started){d.innerHTML=md(ans||'…')}
  }catch(e){d.innerHTML=`<span style="color:#ff3b30">⚠ ${esc(e.message||'connection lost')}</span>`}
  busy=false;send.disabled=false;input.focus();
}
async function boot(){try{const s=await(await AF(API+'/status')).json();$('#dot').classList.toggle('off',s.ollama!=='READY')}catch(e){$('#dot').classList.add('off')}}
boot();
</script>
</body>
</html>
