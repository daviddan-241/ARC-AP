[project]
name = "arenaos"
version = "0.1.0"
description = "ArenaOS — personal autonomous AI operating system: Arena.ai model layer, real Linux execution, task engine, plugin/MCP system, Render-first hosting."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "cryptography>=42",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
browser = ["playwright>=1.43"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arenaos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
