<script>
    // The app shell always exactly covers the VISIBLE viewport, so the
    // composer stays glued above the keyboard and scrolling can never
    // push it away — works in iOS Safari/PWA too (where dvh alone fails).
    (function () {
      function fit() {
        var v = window.visualViewport;
        var h = v ? v.height : window.innerHeight;
        document.documentElement.style.setProperty("--vvh", h + "px");
      }
      window.addEventListener("resize", fit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fit);
        window.visualViewport.addEventListener("scroll", fit);
      }
      fit();
    })();
  </script>
