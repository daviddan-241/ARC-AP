<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>ARC</title>
  <meta name="theme-color" content="#0A0D24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ARC" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png" />
<script>
    // The app shell always exactly covers the VISIBLE viewport, so the
    // composer stays glued above the keyboard and scrolling can never
    // push it away — works in iOS Safari/PWA too (where dvh alone fails).
    (function () {
      function fit() {
        var v = window.visualViewport;
        var h = v ? v.height : window.innerHeight;
        document.documentElement.style.setProperty("--vvh", h + "px");
      }
      window.addEventListener("resize", fit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fit);
        window.visualViewport.addEventListener("scroll", fit);
      }
      fit();
    })();
  </script>
</head>
<body class="bg-bg text-ink">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
