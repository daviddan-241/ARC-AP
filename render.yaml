# ARC on Render — blueprint (free tier)
# NOTE: free tier = 750 instance-hours/month per workspace, 512MB RAM, sleep after 15 min.
# One always-on service fits (720h); two do not — arc-ollama wakes on demand
# (first chat reply may take ~60-90s while the model cold-loads).
# The model host therefore carries small models; point OLLAMA_BASE_URL at
# Ollama Cloud (https://ollama.com) for larger Qwen/DeepSeek families.
services:
  - type: web
    name: arc-ollama
    runtime: docker
    dockerfilePath: ./ollama-service/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: OLLAMA_MODELS
        value: tinydolphin
  - type: web
    name: arc-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: OLLAMA_BASE_URL
        fromService:
          type: web
          name: arc-ollama
          property: hostport
      - key: ARC_API_KEY
        generateValue: true
      - key: ARC_DATA_DIR
        value: /workspace
